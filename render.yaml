services:
  - type: web
    name: sidequest-demo
    runtime: node
    plan: free
    buildCommand: npm install --global pnpm@12.4.1 && pnpm install --frozen-lockfile && pnpm build:web
    startCommand: SERVE_WEB=true pnpm --filter @sidequest/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: XAI_API_KEY
        sync: false
      - key: XAI_TEXT_MODEL
        value: grok-4.20-reasoning-latest
      - key: XAI_IMAGE_MODEL
        value: grok-imagine-image-2.0
      - key: XAI_VOICE_ID
        value: eve
